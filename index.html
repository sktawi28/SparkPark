<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparkPark - هيلتون مكة العزيزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --spark-purple: #6b21a8;
            --spark-light-purple: #8b5cf6;
        }
        body { font-family: 'Cairo', sans-serif; background-color: #fcfaff; color: #1e293b; }
        
        .digital-card {
            background: linear-gradient(145deg, #581c87 0%, #7c3aed 100%);
            box-shadow: 0 20px 40px -10px rgba(107, 33, 168, 0.3);
            color: white;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .digital-card.disabled { 
            background: linear-gradient(145deg, #475569 0%, #64748b 100%) !important; 
            filter: grayscale(0.8); 
        }

        /* تنسيقات البطاقة البيضاء */
        .digital-card.theme-white {
            background: #ffffff !important;
            border: 1px solid #e2e8f0;
        }
        .digital-card.theme-white .text-white { color: #1e293b !important; }
        .digital-card.theme-white .text-purple-200 { color: #64748b !important; }
        .digital-card.theme-white .text-purple-100 { color: #6b21a8 !important; font-weight: 800; }
        .digital-card.theme-white .bg-white\/10 { background-color: #f8fafc !important; border-color: #e2e8f0 !important; }
        .digital-card.theme-white .bg-black\/20 { background-color: #f1f5f9 !important; border-color: #e2e8f0 !important; }
        .digital-card.theme-white .border-white\/10 { border-color: #e2e8f0 !important; }
        .digital-card.theme-white .border-white\/5 { border-color: #e2e8f0 !important; }
        .digital-card.theme-white .opacity-5 { opacity: 0.03 !important; color: #6b21a8 !important; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 10px; }

        .img-fallback {
            display: flex; align-items: center; justify-content: center;
            background: #f3e8ff; color: #6b21a8; font-weight: 900;
            border-radius: 1rem; text-align: center;
        }

        .tab-active {
            background-color: var(--spark-purple);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(107, 33, 168, 0.2);
        }

        .logo-animation {
            animation: fadeInDown 0.8s ease-out;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto">
        
        <!-- قسم شعار الشركة -->
        <div class="flex justify-center mb-10 no-print logo-animation">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl border border-purple-50 flex flex-col items-center min-w-[200px]">
                <img src="icon.png" alt="Spark by Hilton Logo" class="h-24 w-auto mb-3 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="img-fallback h-24 w-40 hidden flex-col">
                    <span class="text-2xl italic">spark</span>
                    <span class="text-[10px] uppercase tracking-tighter">by Hilton</span>
                </div>
                <h2 class="text-xs font-black text-purple-900 uppercase tracking-widest text-center mt-2">سبارك من هيلتون مكة العزيزية</h2>
            </div>
        </div>

        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 no-print">
            <div class="text-center md:text-right">
                <h1 class="text-3xl font-black text-slate-800"> <span class="text-purple-600 tracking-wider">SparkPark</span></h1>
                <p class="text-slate-500 text-sm font-medium">فندق سبارك من هيلتون</p>
            </div>
            
            <div class="flex items-center gap-4 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
                <div class="bg-purple-600 text-white w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-lg">📋</div>
                <div>
                    <span class="text-[10px] block text-slate-400 font-bold uppercase">إجمالي التصاريح</span>
                    <span id="activeStats" class="text-xl font-black text-slate-800">0</span>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap gap-2 mb-8 no-print bg-white/50 backdrop-blur-sm p-1.5 rounded-2xl border border-slate-200 w-full md:w-max">
            <button onclick="switchTab('mgmt')" id="tab-mgmt" class="px-6 py-2.5 rounded-xl font-bold transition-all tab-active">الموظفين</button>
            <button onclick="switchTab('reports')" id="tab-reports" class="px-6 py-2.5 rounded-xl font-bold transition-all text-slate-500 hover:bg-white">السجل اليومي</button>
        </div>

        <!-- Management View -->
        <div id="view-mgmt" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Form -->
            <div class="lg:col-span-4 no-print">
                <div class="bg-white p-6 rounded-[2rem] shadow-lg border border-slate-100">
                    <h2 class="text-lg font-black mb-5 flex items-center gap-2 text-slate-800">
                        <span class="text-purple-600">➕</span> <span id="formTitle">إصدار تصريح جديد</span>
                    </h2>
                    <form id="employeeForm" class="space-y-4">
                        <div class="grid grid-cols-1 gap-3">
                            <div class="grid grid-cols-3 gap-2">
                                <input type="text" id="empFirstName" required class="w-full p-3 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-purple-200 transition-all font-bold text-xs text-center" placeholder="الاسم الأول">
                                <input type="text" id="empMiddleName" class="w-full p-3 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-purple-200 transition-all font-bold text-xs text-center" placeholder="الثاني (اختياري)">
                                <input type="text" id="empLastName" required class="w-full p-3 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-purple-200 transition-all font-bold text-xs text-center" placeholder="اللقب">
                            </div>
                            <!-- تقييد رقم الهوية بـ 10 خانات -->
                            <input type="text" id="empNationalId" maxlength="10" minlength="10" class="w-full p-3.5 bg-slate-50 rounded-xl outline-none text-left text-sm font-mono" placeholder="رقم الهوية (اختياري)" dir="ltr" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            <input type="text" id="empTitle" class="w-full p-3.5 bg-slate-50 rounded-xl outline-none text-sm" placeholder="المسمى الوظيفي (اختياري)">
                            <!-- تقييد رقم الجوال بـ 10 خانات -->
                            <input type="tel" id="empPhone" maxlength="10" minlength="10" class="w-full p-3.5 bg-slate-50 rounded-xl outline-none text-left text-sm" placeholder="رقم الجوال (اختياري)" dir="ltr" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                        
                        <div class="pt-2">
                            <div class="grid grid-cols-3 gap-2 mb-2">
                                <input type="text" id="carBrand" required class="p-3 bg-slate-50 rounded-xl outline-none text-xs text-center font-bold" placeholder="الماركة">
                                <input type="text" id="carModel" required class="p-3 bg-slate-50 rounded-xl outline-none text-xs text-center font-bold" placeholder="الطراز">
                                <input type="text" id="carColor" required class="p-3 bg-slate-50 rounded-xl outline-none text-xs text-center font-bold" placeholder="اللون">
                            </div>
                            
                            <div class="bg-purple-50/50 p-4 rounded-xl border border-purple-100">
                                <p class="text-[10px] text-purple-500 font-bold mb-3 text-center uppercase">رقم لوحة السيارة</p>
                                <div class="flex gap-1.5">
                                    <!-- الحروف العربية في 3 خانات -->
                                    <div class="w-1/3 flex gap-1">
                                        <input type="text" id="pAr1" maxlength="1" required class="w-full p-2 bg-white rounded-lg text-center font-bold text-sm" placeholder="أ" oninput="this.value = this.value.replace(/[^\u0600-\u06FF]/g, ''); if(this.value) document.getElementById('pAr2').focus()">
                                        <input type="text" id="pAr2" maxlength="1" class="w-full p-2 bg-white rounded-lg text-center font-bold text-sm" placeholder="ب" oninput="this.value = this.value.replace(/[^\u0600-\u06FF]/g, ''); if(this.value) document.getElementById('pAr3').focus()">
                                        <input type="text" id="pAr3" maxlength="1" class="w-full p-2 bg-white rounded-lg text-center font-bold text-sm" placeholder="ج" oninput="this.value = this.value.replace(/[^\u0600-\u06FF]/g, ''); if(this.value) document.getElementById('pNum').focus()">
                                    </div>
                                    <input type="text" id="pNum" maxlength="4" inputmode="numeric" required class="w-1/3 p-3 bg-white rounded-lg text-center font-bold text-lg" placeholder="1234" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                    <input type="text" id="pEn" maxlength="3" required class="w-1/3 p-3 bg-white rounded-lg text-center font-bold text-lg uppercase" placeholder="ABC" dir="ltr" oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '').toUpperCase()">
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" id="submitBtn" class="flex-grow bg-purple-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-purple-700 active:scale-[0.98] transition-all">حفظ وإصدار البطاقة</button>
                            <!-- زر الإلغاء، يظهر فقط أثناء التعديل -->
                            <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden px-6 bg-slate-200 text-slate-700 font-black rounded-xl hover:bg-slate-300 active:scale-[0.98] transition-all">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- List and Preview -->
            <div class="lg:col-span-8 flex flex-col md:flex-row gap-8">
                <!-- List -->
                <div class="flex-grow bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 h-[600px] flex flex-col no-print">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-md font-black">الموظفين المسجلين</h2>
                        <span id="listCount" class="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
                    </div>
                    <div id="employeesList" class="space-y-3 overflow-y-auto custom-scrollbar flex-grow pr-1">
                        <!-- JS Content -->
                    </div>
                </div>

                <!-- Preview Area -->
                <div class="flex flex-col items-center w-full md:w-auto">
                    <div id="cardExportArea" class="p-4 bg-slate-100 rounded-[2.5rem] hidden w-max mx-auto shadow-sm mt-6 md:mt-0">
                        
                        <!-- أزرار اختيار لون البطاقة -->
                        <div class="flex justify-center gap-4 mb-4 no-print" data-html2canvas-ignore="true">
                            <button id="btnThemePurple" onclick="setCardTheme('purple')" class="w-8 h-8 rounded-full bg-gradient-to-br from-[#581c87] to-[#7c3aed] shadow-md ring-2 ring-purple-600 ring-offset-2 transition-all" title="بطاقة موف"></button>
                            <button id="btnThemeWhite" onclick="setCardTheme('white')" class="w-8 h-8 rounded-full bg-white shadow-sm border border-slate-300 transition-all" title="بطاقة بيضاء"></button>
                        </div>

                        <div id="cardPreview" class="digital-card w-[320px] rounded-[2.2rem] p-7 min-h-[520px] flex flex-col relative overflow-hidden shadow-2xl">
                            <!-- Logo Overlay -->
                            <div class="absolute -bottom-12 -right-12 opacity-5 rotate-12">
                                <span class="text-9xl font-black italic">spark</span>
                            </div>

                            <div class="flex justify-center items-center mb-6 relative z-10">
                                <img id="cardLogoImage" src="imge.png" alt="Spark by Hilton Makkah Aziziyah" class="w-48 h-auto object-contain drop-shadow-sm" onerror="this.style.display='none'">
                            </div>
                            
                            <div class="flex-grow space-y-6 relative z-10">
                                <div class="bg-white/10 p-4 rounded-2xl border border-white/10 backdrop-blur-sm">
                                    <p class="text-purple-100 text-[9px] mb-0.5 font-bold uppercase">Employee / الموظف</p>
                                    <p id="viewName" class="text-lg font-black text-white truncate">---</p>
                                    <div class="flex justify-between items-center mt-1">
                                        <p id="viewTitle" class="text-[10px] text-purple-200 font-semibold">---</p>
                                        <p id="viewNationalId" class="text-[9px] text-white font-bold bg-black/20 px-2 py-0.5 rounded tracking-widest hidden" dir="ltr">---</p>
                                    </div>
                                </div>
                                
                                <div class="bg-black/20 rounded-2xl p-4 border border-white/5 space-y-3">
                                    <div class="flex justify-between items-center">
                                        <p id="viewVehicle" class="text-xs font-black italic text-white truncate">---</p>
                                    </div>
                                    
                                    <!-- تصميم اللوحة الجديد -->
                                    <div class="bg-white rounded-xl shadow-[inset_0_2px_8px_rgba(0,0,0,0.08)] flex overflow-hidden w-full h-16 border-2 border-slate-200 relative">
                                        <!-- الحروف العربية -->
                                        <div class="flex-1 flex items-center justify-center border-l-2 border-slate-200 bg-slate-50/80">
                                            <span id="viewPAr" class="text-xl font-black text-slate-800 ml-1">---</span>
                                        </div>
                                        
                                        <!-- الأرقام -->
                                        <div class="flex-[1.5] flex items-center justify-center bg-white relative">
                                            <span id="viewPNum" class="text-4xl font-black text-slate-900 tracking-[0.15em] ml-1">0000</span>
                                        </div>
                                        
                                        <!-- الحروف الإنجليزية مع إشارة KSA -->
                                        <div class="flex-1 flex items-center justify-center border-r-2 border-slate-200 bg-slate-50/80 relative">
                                            <span id="viewPEn" class="text-lg font-black uppercase text-slate-800 tracking-[0.2em] ml-1" dir="ltr">---</span>
                                            <div class="absolute bottom-[3px] left-1.5 flex flex-col items-center opacity-60">
                                                <span class="text-[5px] font-black text-slate-800 leading-none mb-[1px]">KSA</span>
                                                <div class="w-3 h-1.5 bg-green-600 rounded-[1px]"></div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="mt-6 flex flex-col items-center justify-center border-t border-white/10 pt-5 relative z-10 text-center">
                                <p id="viewPhone" class="text-sm font-black text-white tracking-widest" dir="ltr">---</p>
                            </div>
                        </div>
                    </div>

                    <div id="actionButtons" class="mt-4 w-full max-w-[320px] space-y-2 no-print hidden">
                        <button onclick="downloadImage()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-xs hover:bg-black transition-all flex items-center justify-center gap-2">
                            <span>📲</span> حفظ / مشاركة الصورة
                        </button>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="toggleStatusBtn" onclick="toggleEmployeeStatus()" class="py-2.5 rounded-xl font-bold text-[10px] transition-all border-2">تعطيل</button>
                            <button id="movementBtn" onclick="toggleMovement()" class="py-2.5 rounded-xl font-bold text-[10px] shadow-md transition-all">تسجيل حركة</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reports View -->
        <div id="view-reports" class="hidden">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h2 class="text-xl font-black text-slate-800 mb-2">سجل الحركات</h2>
                        
                        <!-- خيارات تصفية التقرير -->
                        <div class="flex flex-wrap items-center gap-3">
                            <select id="reportType" onchange="toggleReportInput()" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl outline-none p-2.5 font-bold cursor-pointer transition-all focus:border-purple-300">
                                <option value="daily">تقرير يومي</option>
                                <option value="monthly">تقرير شهري</option>
                            </select>
                            
                            <input type="date" id="reportDateInput" onchange="renderLogs()" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl outline-none p-2.5 font-bold cursor-pointer transition-all focus:border-purple-300">
                            
                            <input type="month" id="reportMonthInput" onchange="renderLogs()" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl outline-none p-2.5 font-bold cursor-pointer transition-all focus:border-purple-300 hidden">
                        </div>
                    </div>
                    <button onclick="exportReportPDF()" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-black text-sm shadow-md hover:bg-purple-700 transition-all w-full md:w-auto flex justify-center items-center gap-2">
                        <span>📄</span> تصدير التقرير PDF
                    </button>
                </div>
                <div class="overflow-x-auto" id="reportPrintArea">
                    <table class="w-full text-right">
                        <thead>
                            <tr class="text-slate-400 text-[10px] font-bold uppercase border-b border-slate-50">
                                <th class="p-4">الموظف</th>
                                <th class="p-4">المركبة</th>
                                <th class="p-4">الحركة</th>
                                <th class="p-4">الوقت والتاريخ</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody" class="text-sm">
                            <!-- JS Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-3.5 rounded-full shadow-2xl hidden z-50 text-xs font-bold flex items-center gap-3 transition-all"></div>

    <script>
        let employees = JSON.parse(localStorage.getItem('spark_parking_emps')) || [];
        let logs = JSON.parse(localStorage.getItem('spark_parking_logs')) || [];
        let activeId = null;
        let editingId = null; // متغير لحفظ آي دي الموظف الجاري تعديله
        let currentCardTheme = 'purple'; 

        function switchTab(tab) {
            document.querySelectorAll('#view-mgmt, #view-reports').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
                btn.className = btn.id === `tab-${tab}` 
                    ? 'px-6 py-2.5 rounded-xl font-bold transition-all tab-active' 
                    : 'px-6 py-2.5 rounded-xl font-bold transition-all text-slate-500 hover:bg-white';
            });

            if (tab === 'reports') renderLogs();
        }

        document.getElementById('employeeForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const natIdVal = document.getElementById('empNationalId').value;
            const phoneVal = document.getElementById('empPhone').value;

            // التحقق من أن الخانات تساوي 10 بالضبط في حال تم تعبئتها
            if (natIdVal && natIdVal.length !== 10) {
                showToast("⚠️ رقم الهوية يجب أن يتكون من 10 أرقام");
                return;
            }
            if (phoneVal && phoneVal.length !== 10) {
                showToast("⚠️ رقم الجوال يجب أن يتكون من 10 أرقام");
                return;
            }
            
            const fName = document.getElementById('empFirstName').value.trim();
            const mName = document.getElementById('empMiddleName').value.trim();
            const lName = document.getElementById('empLastName').value.trim();
            const fullName = [fName, mName, lName].filter(Boolean).join(' ');

            // دمج الحروف العربية بمسافات لعدم التصاقها (مع تجاهل الخانات الفارغة)
            const plateArCombined = [
                document.getElementById('pAr1').value,
                document.getElementById('pAr2').value,
                document.getElementById('pAr3').value
            ].filter(Boolean).join('');

            const empData = {
                id: editingId || ('ID' + Math.random().toString(36).substr(2, 6).toUpperCase()),
                fName: fName,
                mName: mName,
                lName: lName,
                name: fullName,
                nationalId: document.getElementById('empNationalId').value || '',
                title: document.getElementById('empTitle').value || '---',
                phone: document.getElementById('empPhone').value || '---',
                brand: document.getElementById('carBrand').value,
                model: document.getElementById('carModel').value,
                color: document.getElementById('carColor').value,
                plateAr: plateArCombined,
                plateNum: document.getElementById('pNum').value,
                plateEn: document.getElementById('pEn').value
            };

            if (editingId) {
                // وضع التعديل
                const idx = employees.findIndex(e => e.id === editingId);
                if (idx !== -1) {
                    // الاحتفاظ بالبيانات السابقة التي لا تعدل من النموذج
                    empData.isActive = employees[idx].isActive;
                    empData.isInside = employees[idx].isInside;
                    empData.dateAdded = employees[idx].dateAdded;
                    employees[idx] = empData;
                }
                showToast("✅ تم تحديث بيانات البطاقة بنجاح");
                const currentEditedId = editingId; // حفظه لاستدعاء المعاينة بعد الغاء وضع التعديل
                cancelEdit(); 
                showPreview(currentEditedId);
            } else {
                // وضع إضافة جديد
                empData.isActive = true;
                empData.isInside = false;
                empData.dateAdded = new Date().toISOString();
                employees.unshift(empData);
                showToast("✅ تم إصدار التصريح بنجاح");
                this.reset();
                showPreview(empData.id);
            }
            
            saveData();
            renderEmployees();
        });

        // دالة بدء وضع التعديل
        function editEmp(id) {
            const emp = employees.find(e => e.id === id);
            if (!emp) return;
            
            editingId = id;
            document.getElementById('formTitle').innerText = "تعديل بيانات التصريح";
            document.getElementById('submitBtn').innerText = "تحديث بيانات البطاقة";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            // تعبئة حقول الاسم
            if (emp.fName !== undefined) {
                document.getElementById('empFirstName').value = emp.fName;
                document.getElementById('empMiddleName').value = emp.mName || '';
                document.getElementById('empLastName').value = emp.lName;
            } else {
                // للبيانات القديمة التي لم يتم فصل أسمائها مسبقاً
                const parts = emp.name.split(' ');
                if (parts.length === 1) {
                    document.getElementById('empFirstName').value = parts[0];
                    document.getElementById('empMiddleName').value = '';
                    document.getElementById('empLastName').value = '';
                } else if (parts.length === 2) {
                    document.getElementById('empFirstName').value = parts[0];
                    document.getElementById('empMiddleName').value = '';
                    document.getElementById('empLastName').value = parts[1];
                } else {
                    document.getElementById('empFirstName').value = parts[0];
                    document.getElementById('empLastName').value = parts.pop();
                    document.getElementById('empMiddleName').value = parts.join(' ');
                }
            }

            document.getElementById('empNationalId').value = emp.nationalId || '';
            document.getElementById('empTitle').value = emp.title === '---' ? '' : emp.title;
            document.getElementById('empPhone').value = emp.phone === '---' ? '' : emp.phone;
            document.getElementById('carBrand').value = emp.brand || '';
            document.getElementById('carModel').value = emp.model || '';
            document.getElementById('carColor').value = emp.color || '';
            
            // توزيع الحروف العربية على الخانات الثلاث
            const arChars = (emp.plateAr || '').replace(/\s/g, '').split('');
            document.getElementById('pAr1').value = arChars[0] || '';
            document.getElementById('pAr2').value = arChars[1] || '';
            document.getElementById('pAr3').value = arChars[2] || '';

            document.getElementById('pNum').value = emp.plateNum || '';
            document.getElementById('pEn').value = emp.plateEn || '';

            switchTab('mgmt');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // دالة إلغاء التعديل
        function cancelEdit() {
            editingId = null;
            document.getElementById('employeeForm').reset();
            document.getElementById('formTitle').innerText = "إصدار تصريح جديد";
            document.getElementById('submitBtn').innerText = "حفظ وإصدار البطاقة";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function renderEmployees() {
            const list = document.getElementById('employeesList');
            document.getElementById('listCount').innerText = employees.length;
            
            if (!employees.length) {
                list.innerHTML = `<div class="text-center py-20 opacity-20"><p class="text-4xl">📭</p><p class="text-xs mt-2">لا يوجد تصاريح</p></div>`;
                return;
            }

            list.innerHTML = employees.map(emp => `
                <div onclick="showPreview('${emp.id}')" class="group p-4 bg-white border ${emp.isActive ? 'border-slate-50' : 'border-red-50 bg-red-50/10'} rounded-2xl cursor-pointer hover:border-purple-200 hover:shadow-md transition-all flex flex-col gap-3 relative">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center bg-purple-50 text-purple-600 font-bold text-[10px]">
                                ${emp.name.charAt(0)}
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-800 text-xs">${emp.name}</h4>
                                <p class="text-[9px] text-slate-400 font-medium">${emp.title || '---'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="event.stopPropagation(); editEmp('${emp.id}')" class="text-slate-400 hover:text-blue-600 transition-colors p-1.5 text-sm bg-slate-50 hover:bg-blue-50 rounded-lg" title="تعديل">✏️</button>
                            <button onclick="event.stopPropagation(); deleteEmp('${emp.id}')" class="text-slate-400 hover:text-red-600 transition-colors p-1.5 text-sm bg-slate-50 hover:bg-red-50 rounded-lg" title="حذف">✕</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-slate-50/80 p-2 rounded-xl">
                        <div class="text-[9px] font-bold text-slate-500">
                            ${emp.brand} • ${emp.plateNum}
                        </div>
                        <span class="text-[7px] px-2 py-0.5 rounded-full font-black uppercase ${emp.isInside ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-200 text-slate-400'}">
                            ${emp.isInside ? 'داخل المواقف' : 'خارج'}
                        </span>
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        function showPreview(id) {
            const emp = employees.find(e => e.id === id);
            if (!emp) return;
            activeId = id;

            const exportArea = document.getElementById('cardExportArea');
            const preview = document.getElementById('cardPreview');
            
            // إظهار منطقة المعاينة والبطاقة
            exportArea.classList.remove('hidden');
            preview.classList.remove('hidden');
            document.getElementById('actionButtons').classList.remove('hidden');

            // التحديث الآمن للعناصر
            if(document.getElementById('viewName')) document.getElementById('viewName').innerText = emp.name;
            if(document.getElementById('viewTitle')) document.getElementById('viewTitle').innerText = emp.title || '---';
            
            const natIdEl = document.getElementById('viewNationalId');
            if(natIdEl) {
                if(emp.nationalId && emp.nationalId !== '---' && emp.nationalId !== '') {
                    natIdEl.innerText = emp.nationalId;
                    natIdEl.classList.remove('hidden');
                } else {
                    natIdEl.classList.add('hidden');
                }
            }

            if(document.getElementById('viewVehicle')) document.getElementById('viewVehicle').innerText = `${emp.brand} ${emp.model} - ${emp.color || '---'}`;
            if(document.getElementById('viewPAr')) document.getElementById('viewPAr').innerText = (emp.plateAr || '').replace(/\s/g, '').split('').join(' ');
            if(document.getElementById('viewPNum')) document.getElementById('viewPNum').innerText = emp.plateNum;
            if(document.getElementById('viewPEn')) document.getElementById('viewPEn').innerText = emp.plateEn;
            if(document.getElementById('viewPhone')) document.getElementById('viewPhone').innerText = emp.phone || '---';
            
            preview.className = `digital-card w-[320px] rounded-[2.2rem] p-7 min-h-[520px] flex flex-col relative overflow-hidden shadow-2xl ${!emp.isActive ? 'disabled' : ''}`;

            // تطبيق اللون المختار حالياً وتحديث الشعار
            setCardTheme(currentCardTheme);

            const toggleBtn = document.getElementById('toggleStatusBtn');
            if (toggleBtn) {
                toggleBtn.innerText = emp.isActive ? "تعطيل التصريح" : "تنشيط التصريح";
                toggleBtn.className = emp.isActive ? "py-2.5 rounded-xl font-bold text-[10px] border-2 border-red-50 text-red-500" : "py-2.5 rounded-xl font-bold text-[10px] border-2 border-emerald-50 text-emerald-600";
            }
            
            const moveBtn = document.getElementById('movementBtn');
            if (moveBtn) {
                if(emp.isInside) {
                    moveBtn.innerText = "تسجيل خروج";
                    moveBtn.className = "bg-orange-500 text-white py-2.5 rounded-xl font-bold text-[10px] shadow-md transition-all";
                } else {
                    moveBtn.innerText = "تسجيل دخول";
                    moveBtn.className = "bg-emerald-500 text-white py-2.5 rounded-xl font-bold text-[10px] shadow-md transition-all";
                }
            }

            if (window.innerWidth < 1024) preview.scrollIntoView({ behavior: 'smooth' });
        }

        function setCardTheme(theme) {
            currentCardTheme = theme;
            const preview = document.getElementById('cardPreview');
            const btnPurple = document.getElementById('btnThemePurple');
            const btnWhite = document.getElementById('btnThemeWhite');
            const cardLogo = document.getElementById('cardLogoImage');
            
            if (!preview) return;

            if (theme === 'white') {
                preview.classList.add('theme-white');
                btnWhite.classList.add('ring-2', 'ring-purple-600', 'ring-offset-2', 'border-transparent');
                btnPurple.classList.remove('ring-2', 'ring-purple-600', 'ring-offset-2');
                if(cardLogo) cardLogo.src = 'photo.png'; // الشعار الملون للبطاقة البيضاء
            } else {
                preview.classList.remove('theme-white');
                btnPurple.classList.add('ring-2', 'ring-purple-600', 'ring-offset-2');
                btnWhite.classList.remove('ring-2', 'ring-purple-600', 'ring-offset-2', 'border-transparent');
                if(cardLogo) cardLogo.src = 'imge.png'; // الشعار الأبيض للبطاقة الموف
            }
        }

        function toggleMovement() {
            const emp = employees.find(e => e.id === activeId);
            if (!emp) return;
            if (!emp.isActive) return showToast("❌ لا يمكن تسجيل حركة، التصريح معطل");
            
            logMovement(emp.isInside ? 'OUT' : 'IN');
        }

        function logMovement(type) {
            const idx = employees.findIndex(e => e.id === activeId);
            if (idx === -1) return;
            
            employees[idx].isInside = (type === 'IN');
            const now = new Date();
            
            // استخراج التاريخ بصيغة ISO لتسهيل الفلترة (YYYY-MM-DD)
            const localIsoDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            
            logs.unshift({
                name: employees[idx].name,
                plate: `${employees[idx].brand} (${employees[idx].plateNum})`,
                type: type === 'IN' ? 'دخول' : 'خروج',
                time: now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }),
                date: now.toLocaleDateString('ar-SA'),
                isoDate: localIsoDate // حقل جديد لتسهيل البحث بالتاريخ
            });
            
            saveData();
            renderEmployees();
            showPreview(activeId);
            showToast(type === 'IN' ? "📥 تم تسجيل الدخول" : "📤 تم تسجيل الخروج");
        }

        function toggleReportInput() {
            const type = document.getElementById('reportType').value;
            if (type === 'daily') {
                document.getElementById('reportDateInput').classList.remove('hidden');
                document.getElementById('reportMonthInput').classList.add('hidden');
            } else {
                document.getElementById('reportDateInput').classList.add('hidden');
                document.getElementById('reportMonthInput').classList.remove('hidden');
            }
            renderLogs();
        }

        function renderLogs() {
            const tbody = document.getElementById('logsTableBody');
            const type = document.getElementById('reportType').value;
            let filterValue = '';
            
            if (type === 'daily') {
                filterValue = document.getElementById('reportDateInput').value; // صيغة: YYYY-MM-DD
            } else {
                filterValue = document.getElementById('reportMonthInput').value; // صيغة: YYYY-MM
            }
            
            // فلترة السجلات بناءً على التاريخ
            const filteredLogs = logs.filter(l => {
                // استخدام isoDate إذا كان متوفراً، أو استخلاصه من السجلات القديمة
                const logDate = l.isoDate || new Date().toISOString().split('T')[0]; 
                return logDate.startsWith(filterValue);
            });

            if (!filteredLogs.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center opacity-30 italic text-xs">لا توجد حركات مسجلة في هذا التاريخ</td></tr>`;
                return;
            }

            tbody.innerHTML = filteredLogs.map(l => `
                <tr class="border-b border-slate-50 hover:bg-slate-50">
                    <td class="p-4 font-bold text-xs">${l.name}</td>
                    <td class="p-4 text-[10px] text-slate-400">${l.plate}</td>
                    <td class="p-4"><span class="text-[10px] font-black ${l.type === 'دخول' ? 'text-emerald-500' : 'text-orange-500'}">${l.type}</span></td>
                    <td class="p-4 text-[10px] font-mono text-slate-400">${l.time} <span class="block text-[8px] opacity-60 font-sans">${l.date}</span></td>
                </tr>
            `).join('');
        }

        function saveData() {
            localStorage.setItem('spark_parking_emps', JSON.stringify(employees));
            localStorage.setItem('spark_parking_logs', JSON.stringify(logs));
            updateStats();
        }

        function updateStats() {
            document.getElementById('activeStats').innerText = employees.length;
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function deleteEmp(id) {
            if(confirm("هل أنت متأكد من حذف هذا التصريح؟ لن تتمكن من التراجع.")) {
                employees = employees.filter(e => e.id !== id);
                if (editingId === id) cancelEdit();
                saveData();
                renderEmployees();
                document.getElementById('cardExportArea').classList.add('hidden');
                document.getElementById('actionButtons').classList.add('hidden');
            }
        }

        function toggleEmployeeStatus() {
            const idx = employees.findIndex(e => e.id === activeId);
            if (idx !== -1) {
                employees[idx].isActive = !employees[idx].isActive;
                saveData();
                renderEmployees();
                showPreview(activeId);
            }
        }

        async function downloadImage() {
            const emp = employees.find(e => e.id === activeId);
            if (!emp) return;
            
            const element = document.getElementById('cardPreview');
            const parent = element.parentElement;
            
            showToast("⏳ جاري تجهيز الصورة...");
            try {
                // إزالة الظلال وخلفية الحاوية مؤقتاً لتجنب ظهور حواف بيضاء حول الصورة
                element.classList.remove('shadow-2xl');
                const originalBg = parent.style.backgroundColor;
                parent.style.backgroundColor = 'transparent';

                // استخدام scale 3 لجودة أعلى مع الحفاظ على شفافية الزوايا تماماً
                const canvas = await html2canvas(element, {
                    scale: 3, 
                    useCORS: true, 
                    backgroundColor: null 
                });
                
                // إعادة الظلال والخلفية بعد التقاط الصورة مباشرة
                element.classList.add('shadow-2xl');
                parent.style.backgroundColor = originalBg;
                
                canvas.toBlob(async function(blob) {
                    const fileName = `Spark_Card_${emp.name}.png`;
                    const file = new File([blob], fileName, { type: 'image/png' });

                    // التحقق مما إذا كان الهاتف يدعم ميزة المشاركة الأصلية للملفات
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'بطاقة SparkPark',
                                text: `بطاقة دخول الموظف: ${emp.name}`
                            });
                            showToast("✅ تم بنجاح");
                        } catch (error) {
                            // إذا قام المستخدم بإلغاء المشاركة، نتجاهل الخطأ. غير ذلك نقوم بالتنزيل العادي.
                            if (error.name !== 'AbortError') {
                                fallbackDownload(blob, fileName);
                            }
                        }
                    } else {
                        // المتصفح لا يدعم المشاركة، ننتقل للتحميل المباشر
                        fallbackDownload(blob, fileName);
                    }
                }, 'image/png');
                
            } catch (err) {
                console.error(err);
                showToast("❌ حدث خطأ أثناء تجهيز الصورة");
            }
        }

        // دالة مساعدة للتحميل المباشر (كبديل في حال عدم توفر قائمة المشاركة)
        function fallbackDownload(blob, fileName) {
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
            showToast("✅ تم حفظ الصورة بنجاح");
        }

        async function exportReportPDF() {
            const element = document.getElementById('reportPrintArea');
            const type = document.getElementById('reportType').value;
            const dateVal = type === 'daily' ? document.getElementById('reportDateInput').value : document.getElementById('reportMonthInput').value;

            const opt = { 
                margin: 10, 
                filename: `Spark_Report_${dateVal}.pdf`, 
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4' } 
            };
            
            showToast("⏳ جاري تصدير التقرير...");
            await html2pdf().set(opt).from(element).save();
        }
        
        function initDateInputs() {
            const today = new Date();
            const localIso = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString();
            
            document.getElementById('reportDateInput').value = localIso.split('T')[0];
            document.getElementById('reportMonthInput').value = localIso.split('T')[0].substring(0, 7);
        }

        window.onload = () => {
            initDateInputs();
            renderEmployees();
            switchTab('mgmt');
        };
    </script>
</body>
</html>
